<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bible</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261102-16" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261102-1">
  </head>
  <body>
    <div class="app-shell">
      <div class="topbar">
        <div class="app-brand">
          <span class="app-icon-wrap">
            <img class="app-icon" src="/favicon.ico?v=20261102-1" alt="" />
          </span>
          <h1>Bible Study</h1>
        </div>
        <div class="topbar-actions">
          <a class="help-link" href="/learn-books">Learn the books</a>
          <a class="help-link" href="/help">Help</a>
          <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
            Dark mode
          </button>
        </div>
      </div>

      <main class="container">
        <form id="searchForm" class="search-form">
          <label class="sr-only" for="searchInput">Search</label>
          <textarea
            id="searchInput"
            name="query"
            rows="2"
            placeholder="Search word or reference..."
            autocomplete="off"
          >{{ initial_query|default('', true) }}</textarea>

          <div class="actions" aria-label="Search actions">
            <button type="submit" id="searchButton">Search</button>
            <button type="button" id="referenceButton" class="secondary">Reference</button>
            <button type="button" id="multiReferenceButton" class="secondary" aria-label="Look up multiple references and preserve pasted notes" title="Look up references in pasted notes and keep the notes in order">Multi-reference</button>
          </div>
        </form>

        <div class="accordion-groups">
          <div class="accordion-block">
            <button type="button" class="accordion-toggle" data-target="searchOptions" aria-expanded="false">
              <span class="accordion-label">Search options</span>
              <span class="accordion-arrow" aria-hidden="true">▸</span>
            </button>

            <div id="searchOptions" class="accordion-panel" data-expanded-by-user="false">
              <div class="option-grid">
                <label>
                  <span>Search type</span>
                  <select id="searchType">
                    <option value="All Words">All Words</option>
                    <option value="Phrase">Phrase</option>
                    <option value="Any Word">Any Word</option>
                  </select>
                </label>

                <label>
                  <span>Book group</span>
                  <select id="bookGroup">
                    <option value="All Books">All Books</option>
                    <option value="Old Testament">Old Testament</option>
                    <option value="New Testament">New Testament</option>
                    <option value="Law">Law</option>
                    <option value="History">History</option>
                    <option value="Poetry">Poetry</option>
                    <option value="Prophets">Prophets</option>
                    <option value="Gospels">Gospels</option>
                    <option value="Epistles">Epistles</option>
                  </select>
                </label>

                <label>
                  <span>Context window</span>
                  <select id="contextWindow">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                  </select>
                </label>


                <label class="check-row">
                  <input id="caseSensitive" type="checkbox" />
                  <span>Case sensitive</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="export-controls">
          <label for="exportFormat">Export</label>
          <select id="exportFormat" aria-label="Export format">
            <option value="xlsx">XLSX</option>
            <option value="md">Markdown</option>
            <option value="docx">DOCX</option>
            <option value="txt">TXT</option>
            <option value="csv">CSV</option>
          </select>
          <div class="export-actions">
            <button type="button" id="copyButton" class="secondary">Copy</button>
            <button type="button" id="exportButton" class="secondary">Download</button>
          </div>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
        <div id="results" class="results" aria-live="polite"></div>
      </main>

      <footer id="displayOptions" class="display-options-dock" aria-label="Display options">
        <h2 class="display-options-heading">Display options</h2>
        <button id="displayOptionsToggle" type="button" class="display-options-toggle" aria-expanded="false" aria-controls="displayOptionsGrid">
          <span>Display options</span>
          <span class="accordion-arrow" aria-hidden="true">▸</span>
        </button>
        <div id="displayOptionsGrid" class="display-options-grid">
          <div class="display-option-item">
            <button type="button" class="display-option-button" data-option-control="granularity" data-option-label="Group"></button>
            <select id="granularity" hidden>
              <option value="Verse">Verse</option>
              <option value="Passage">Passage</option>
            </select>
          </div>

          <div class="display-option-item">
            <button type="button" class="display-option-button" data-option-control="referenceStyle" data-option-label="Reference"></button>
            <select id="referenceStyle" hidden>
              <option value="Wikilink">Wikilink</option>
              <option value="Standard">Standard</option>
            </select>
          </div>

          <div class="display-option-item">
            <button type="button" class="display-option-button" data-option-control="referencePosition" data-option-label="Reference"></button>
            <select id="referencePosition" hidden>
              <option value="Ref First">First</option>
              <option value="Ref Last">Last</option>
            </select>
          </div>

          <div class="display-option-item">
            <button type="button" class="display-option-button" data-option-control="showRedLetters" data-option-label="Red Letter"></button>
            <input id="showRedLetters" type="checkbox" checked hidden />
          </div>

          <div class="display-option-item">
            <button type="button" class="display-option-button" data-option-control="suppressParagraphs" data-option-label="¶"></button>
            <input id="suppressParagraphs" type="checkbox" checked hidden />
          </div>

          <div id="highlightMatchesRow" class="display-option-item">
            <button type="button" class="display-option-button" data-option-control="highlightMatches" data-option-label="Highlight Search"></button>
            <input id="highlightMatches" type="checkbox" checked hidden />
          </div>

          <div id="referenceLinksRow" class="display-option-item">
            <button type="button" class="display-option-button" data-option-control="showReferenceLinks" data-option-label="Links"></button>
            <input id="showReferenceLinks" type="checkbox" hidden />
          </div>

          <div id="preserveNotesRow" class="display-option-item" hidden>
            <button type="button" class="display-option-button" data-option-control="preserveNotes" data-option-label="Preserve notes"></button>
            <input id="preserveNotes" type="checkbox" hidden />
          </div>

          <div id="inlineVerseNumbersRow" class="display-option-item" hidden>
            <button type="button" class="display-option-button" data-option-control="showInlineVerseNumbers" data-option-label="Newline Verse"></button>
            <input id="showInlineVerseNumbers" type="checkbox" checked hidden />
          </div>
        </div>
      </footer>
    </div>

    <script>
      window.__INITIAL_QUERY__ = {{ initial_query|default('', true)|tojson }};
    </script>
    <script src="/static/app.js?v=20261103-1"></script>
  </body>
</html>
